  <text x="562" y="187" text-anchor="middle" fill="#8899aa" font-size="9">Jina Reader → curl</text>

  <rect x="645" y="155" width="110" height="40" rx="6" fill="#0d1b2a" stroke="#2a3a4a" stroke-width="1"/>
