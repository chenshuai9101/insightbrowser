  <rect x="615" y="420" width="70" height="28" rx="4" fill="#0d1b2a" stroke="#2a3a4a" stroke-width="0.5"/>
  <text x="650" y="438" text-anchor="middle" fill="#e0e0e0" font-size="9">📄 Content</text>
