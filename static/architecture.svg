  <rect x="45" y="155" width="135" height="40" rx="6" fill="#0d1b2a" stroke="#00d4aa" stroke-width="1"/>
  <text x="112" y="172" text-anchor="middle" fill="#00d4aa" font-size="11" font-weight="bold">🔍 Search</text>
  <text x="112" y="187" text-anchor="middle" fill="#8899aa" font-size="9">search(7020) → Exa MCP</text>

  <rect x="195" y="155" width="135" height="40" rx="6" fill="#0d1b2a" stroke="#2a3a4a" stroke-width="1"/>
  <text x="262" y="172" text-anchor="middle" fill="#e0e0e0" font-size="11" font-weight="bold">🎯 Matching</text>
  <text x="262" y="187" text-anchor="middle" fill="#8899aa" font-size="9">matching(7014)</text>

  <rect x="345" y="155" width="135" height="40" rx="6" fill="#0d1b2a" stroke="#2a3a4a" stroke-width="1"/>
  <text x="412" y="172" text-anchor="middle" fill="#e0e0e0" font-size="11" font-weight="bold">🔌 AHP</text>
  <text x="412" y="187" text-anchor="middle" fill="#8899aa" font-size="9">ahp → A2A bridge</text>

  <rect x="495" y="155" width="135" height="40" rx="6" fill="#0d1b2a" stroke="#2a3a4a" stroke-width="1"/>
