<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f1923;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a2a3a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="reg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4aa;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#00a8ff;stop-opacity:0.9" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="520" fill="url(#bg)" rx="12"/>
  <text x="400" y="35" text-anchor="middle" fill="#e0e0e0" font-size="18" font-weight="bold">🌐 InsightBrowser Architecture</text>

  <!-- Layer 1: Registry -->
  <rect x="200" y="55" width="400" height="45" rx="8" fill="url(#reg)"/>
  <text x="400" y="83" text-anchor="middle" fill="#0d1b2a" font-size="14" font-weight="bold">🏠 Registry :7000 — Agent 注册中心 · AHP 目录服务</text>

  <!-- Layer 2: Channels -->
  <rect x="30" y="120" width="740" height="90" rx="8" fill="#1a2a3a" stroke="#2a3a4a" stroke-width="1"/>
