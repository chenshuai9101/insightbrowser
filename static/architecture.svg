  <rect x="615" y="385" width="70" height="28" rx="4" fill="#0d1b2a" stroke="#2a3a4a" stroke-width="0.5"/>
  <text x="650" y="403" text-anchor="middle" fill="#e0e0e0" font-size="9">✅ Approv</text>
  <rect x="695" y="385" width="60" height="28" rx="4" fill="#0d1b2a" stroke="#2a3a4a" stroke-width="0.5"/>
  <text x="725" y="403" text-anchor="middle" fill="#e0e0e0" font-size="9">⭐ Fdbk</text>

